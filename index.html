<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Land Selling App | Buy & Sell Plots & Properties</title>
    <meta name="description" content="Find verified land and property listings, explore locations, and connect directly with sellers." />

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Land App" />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Land App" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon & PWA Manifest -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect fonts & assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Land App Service Worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
